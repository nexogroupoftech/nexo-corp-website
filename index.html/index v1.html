<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaizen · XOPICX studio assistant</title>
<meta name="description" content="Answers about the XOPICX studio, its work, the agents it builds, and how to get in touch.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--text:#1F1E1C;--muted:#6B6862;--border:#E4E0D8;
  --accent:#C96442;--accent-ink:#A84F31;--on-accent:#FFFFFF;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:12px;--gutter:16px;--measure:680px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1A1917;--surface:#232220;--text:#EDEAE4;--muted:#9C978E;--border:#33312D;
    --accent:#D97757;--accent-ink:#E08A6C;--on-accent:#1A1917;
  }
}
@media (min-width:640px){:root{--gutter:24px}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
}
::selection{background:var(--accent);color:var(--on-accent)}
a{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--accent);text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* top bar */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px var(--gutter);padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap}
.quiet{background:none;border:0;padding:6px 8px;margin-right:-8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:8px}
.quiet:hover{color:var(--text)}

/* scroll area */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;display:flex;flex-direction:column}
.col{width:100%;max-width:calc(var(--measure) + var(--gutter)*2);margin:0 auto;padding:0 var(--gutter)}

/* empty state */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:40px}
.empty[hidden]{display:none}
.empty h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,8vw,48px);line-height:1.1;letter-spacing:-.015em;margin:0}
.empty p{margin:14px 0 0;color:var(--muted);max-width:30em;text-wrap:pretty}
.chips{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:block;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:9px 15px;font-size:14px;line-height:1.4;cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--muted)}
.chip:disabled{cursor:default;color:var(--muted)}
.chip:focus-visible{border-radius:999px}

/* log */
.log{display:flex;flex-direction:column;gap:28px;padding-top:32px;padding-bottom:32px}
.log:empty{display:none}
.msg{margin:0;max-width:100%}
.u{align-self:flex-end;max-width:85%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:10px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{align-self:flex-start;width:100%}
.who{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty}
.dots{display:inline-flex;gap:6px;padding:10px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* composer */
.foot{flex:none;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:6px 6px 6px 14px;transition:border-color .15s}
.box:focus-within{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{flex:1;min-width:0;resize:none;border:0;background:none;color:var(--text);font:inherit;line-height:1.5;
  padding:6px 0;margin:0;height:36px;max-height:calc(1.5em*6 + 12px);overflow-y:hidden}
textarea::placeholder{color:var(--muted);opacity:1}
.send{flex:none;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:9px;
  background:var(--accent);color:var(--on-accent);cursor:pointer;transition:opacity .15s}
.send:hover{opacity:.9}
.send:disabled{opacity:.4;cursor:default}
.send:focus-visible{outline-offset:3px;border-radius:9px}
.meta{display:flex;justify-content:space-between;gap:12px;padding-top:8px;font-size:12px;line-height:1.5;color:var(--muted)}
.count{flex:none;font-variant-numeric:tabular-nums}
.count.over{color:var(--accent-ink)}

@media (prefers-reduced-motion:reduce){
  main{scroll-behavior:auto}
  .dots i{animation:none;opacity:.6}
  *{transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Kaizen</b><span>by XOPICX</span></div>
  <button class="quiet" id="reset" type="button">New chat</button>
</header>

<main id="scroll">
  <section class="empty col" id="empty" aria-labelledby="h">
    <h1 id="h">Ask about XOPICX</h1>
    <p>Kaizen answers questions about the studio, its work, the WhatsApp and Instagram agents it builds, and how to get in touch.</p>
    <ul class="chips" id="chips" aria-label="Suggested questions"></ul>
  </section>
  <div class="log col" id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
</main>

<footer class="foot">
  <form class="col" id="form" autocomplete="off">
    <label class="sr" for="input">Message</label>
    <div class="box">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Ask about the studio, its work, or getting started" aria-describedby="note count" enterkeyhint="send"></textarea>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="meta">
      <span id="note">Answers are written by the XOPICX studio. A TypeSafe Jev model picks which one fits.</span>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </form>
</footer>

<script>
(function () {
  "use strict";
  var ENDPOINT = "/api/chat";
  var MAX = 2000, HINT_AT = 1800;
  var NET_ERR = "Couldn't reach the assistant. Check your connection and try again.";
  var SUGGESTIONS = [
    "What is XOPICX?",
    "Who founded it?",
    "Do you build WhatsApp or Instagram agents?",
    "What have you shipped?",
    "How do I start a project?",
    "How does this assistant work?"
  ];
  var EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g;

  var $ = function (id) { return document.getElementById(id); };
  var scroll = $("scroll"), empty = $("empty"), log = $("log"), chips = $("chips");
  var form = $("form"), input = $("input"), send = $("send"), count = $("count");
  var busy = false, seq = 0;

  SUGGESTIONS.forEach(function (q) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = q;
    b.addEventListener("click", function () { if (!busy) ask(q); });
    li.appendChild(b); chips.appendChild(li);
  });

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Build text + mailto nodes; server text never touches innerHTML.
  function fill(node, text) {
    node.textContent = "";
    var last = 0, m;
    EMAIL.lastIndex = 0;
    while ((m = EMAIL.exec(text))) {
      var addr = m[0].replace(/\.+$/, "");
      if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement("a");
      a.href = "mailto:" + encodeURIComponent(addr).replace(/%40/g, "@");
      a.textContent = addr;
      node.appendChild(a);
      last = m.index + addr.length;
      EMAIL.lastIndex = last;
    }
    if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
  }

  function toBottom() { scroll.scrollTop = scroll.scrollHeight; }

  function showEmpty(on) { empty.hidden = !on; }

  function addUser(text) {
    var m = el("p", "msg u", text);
    m.setAttribute("aria-label", "You: " + text);
    log.appendChild(m);
  }

  function addAssistant() {
    var m = el("div", "msg a");
    m.appendChild(el("span", "who", "Kaizen"));
    var body = el("div", "txt");
    var dots = el("span", "dots");
    dots.setAttribute("role", "status");
    dots.appendChild(el("span", "sr", "Kaizen is finding an answer"));
    for (var i = 0; i < 3; i++) dots.appendChild(document.createElement("i"));
    body.appendChild(dots);
    m.appendChild(body);
    log.appendChild(m);
    return body;
  }

  function setBusy(on) {
    busy = on;
    var bs = chips.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) bs[i].disabled = on;
    sync();
  }

  function sync() {
    send.disabled = busy || !input.value.trim();
    var n = input.value.length;
    if (n > HINT_AT) { count.textContent = n + " / " + MAX; count.className = "count" + (n >= MAX ? " over" : ""); }
    else { count.textContent = ""; count.className = "count"; }
  }

  function grow() {
    input.style.height = "auto";
    var max = parseFloat(getComputedStyle(input).maxHeight);
    var h = Math.min(input.scrollHeight, max);
    input.style.height = h + "px";
    input.style.overflowY = input.scrollHeight > max ? "auto" : "hidden";
  }

  function ask(text) {
    text = String(text).trim().slice(0, MAX);
    if (!text || busy) return;
    var id = ++seq;
    showEmpty(false);
    addUser(text);
    var out = addAssistant();
    setBusy(true);
    toBottom();

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    }).then(function (res) {
      return res.json().then(
        function (data) { return data && typeof data.reply === "string" && data.reply ? data.reply : "The assistant returned an unexpected result."; },
        function () { return "The assistant returned an unexpected result."; }
      );
    }, function () { return NET_ERR; })
    .then(function (reply) {
      if (id !== seq) return;
      fill(out, reply);
      setBusy(false);
      toBottom();
      input.focus({ preventScroll: true });
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v || busy) return;
    input.value = "";
    grow();
    ask(v);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (typeof form.requestSubmit === "function") form.requestSubmit();
      else form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
  input.addEventListener("input", function () { grow(); sync(); });

  $("reset").addEventListener("click", function () {
    seq++;
    log.textContent = "";
    input.value = "";
    grow();
    setBusy(false);
    showEmpty(true);
    scroll.scrollTop = 0;
    input.focus();
  });

  sync();
})();
</script>
</body>
</html>
