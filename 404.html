  <script>
    // Old or mistyped links (e.g. /index.html/ from a link-in-bio) go to the homepage, keeping ?utm_ params.
    (function () {
      var p = location.pathname;
      if (/^\/index\.html\/?/i.test(p) || /^\/index\/?$/i.test(p)) {
        location.replace("/" + location.search + location.hash);
        return;
      }
      // Old multi-page URLs now live as sections of the one-page site.
      var map = { "/projects.html": "#work", "/experiments.html": "#lab", "/about.html": "#studio", "/founder.html": "#founder" };
      if (map[p.toLowerCase()]) location.replace("/" + location.search + map[p.toLowerCase()]);
    })();
  </script>
